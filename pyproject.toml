[project]
name = "skyrisk"
version = "0.1.0"
description = "Weather-risk scoring and conversational agent for logistics hubs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
skyrisk = "skyrisk.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyrisk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit real APIs; skipped by default. Run with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: calls real external APIs (Open-Meteo, FEMA NRI)"]
