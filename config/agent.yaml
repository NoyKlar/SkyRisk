# Agent configuration. Model IDs can be overridden with SKYRISK_PRIMARY_MODEL,
# SKYRISK_FALLBACK_MODEL and SKYRISK_CLASSIFIER_MODEL (the Haiku classifier model).
primary:
  provider: anthropic
  model: claude-sonnet-5
  effort: medium
  timeout_s: 30.0        # per model call; a timeout is not retried, the turn moves to the fallback
fallback:
  provider: openai
  model: gpt-6-luna      # cost-efficient tier; function calling + structured outputs via Responses API
  effort: medium
  timeout_s: 30.0
classifier:
  # Haiku only, with no fallback: if it fails, the check is skipped rather than risking a wrong refusal
  # (see docs/DESIGN.md §7). Jev is opt-in for re-testing: SKYRISK_CLASSIFIER=jev makes it the primary,
  # with Haiku as its fallback (needs JEV_API_KEY).
  primary: haiku
  timeout_s: 5.0
  haiku:
    model: claude-haiku-4-5
  jev:                   # used only when selected via SKYRISK_CLASSIFIER=jev
    model: jev-1.13.0
    base_url: https://api.typesafe.ai
    injection_threshold: 0.5
    uncertain_band: [0.4, 0.6]   # in_scope probability inside the band -> escalate to Haiku
max_tool_rounds: 6
max_input_chars: 2000
max_history_turns: 10
max_output_tokens: 16000
rate_limit:              # POST /api/chat; protects API credits on the public deploy
  per_ip_per_hour: 20
  global_per_day: 100
